<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Heiser — Avatar 2D</title>
<style>
  :root { --maroon: #7A121C; --dark: #560A12; --red: #C8102E; --ink: #2D1518; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 20%, #fffdfa 0%, #f6efe9 55%, #ece2da 100%);
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    color: #3b2b26;
    display: flex; flex-direction: column; align-items: center;
    padding: 18px 16px 32px;
  }
  h1 { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: #8a6a63; margin: 0 0 2px; font-weight: 700; }
  .sub { font-size: 12.5px; color: #a08c85; margin: 0 0 8px; }
  .stage { width: min(540px, 94vw); }
  .stage-svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 10px 18px rgba(74,21,27,0.14)); }
  .hidden { display: none !important; }

  .controls {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    margin-top: 6px; max-width: 560px;
  }
  button {
    font: 600 13.5px/1 "Inter", "Segoe UI", system-ui, sans-serif;
    padding: 10px 16px; border-radius: 999px; cursor: pointer;
    border: 1.5px solid #e3d3cc; background: #fff; color: #6d4a43;
    transition: transform .12s ease, background .12s ease, border-color .12s, color .12s;
  }
  button:hover { transform: translateY(-1px); border-color: #d3b9b0; }
  button.primary { background: var(--red); border-color: var(--red); color: #fff; }
  button.primary:hover { background: #b01629; }
  button.active { background: #f7e7e9; border-color: #d99aa4; color: #8c2233; }

  /* Lampu LED: glow saat bicara, redup saat berpikir */
  @keyframes headlampGlowPulse {
    0%, 100% { opacity: 0.12; }
    50% { opacity: 0.62; }
  }
  @keyframes headlampShimmer {
    0% { transform: translateY(24px); opacity: 0; }
    30% { opacity: 0.65; }
    70% { opacity: 0.65; }
    100% { transform: translateY(-24px); opacity: 0; }
  }
  .headlamp-led-glow, .headlamp-led-shimmer { opacity: 0; pointer-events: none; }
  .leds-active .headlamp-led-glow { animation: headlampGlowPulse 1.15s ease-in-out infinite; }
  .leds-active .headlamp-led-shimmer { animation: headlampShimmer 1.5s ease-in-out infinite; }
  .leds-thinking .headlamp-led-glow { animation: headlampGlowPulse 2.1s ease-in-out infinite; }
  .leds-thinking .headlamp-led-shimmer { animation: headlampShimmer 2.4s ease-in-out infinite; }

  .arm-click { cursor: pointer; }

  body.clean { padding: 0; }
  body.clean h1, body.clean .sub, body.clean .controls { display: none; }
  body.clean .stage { width: 540px; }
</style>
</head>

<div class="controls">
  <button id="btnTalk" class="primary" type="button">Bicara</button>
  <button data-exp="normal" type="button">Normal</button>

  <button data-exp="surprised" type="button">Kaget</button>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const svg = $('heiser-svg');
  const stage = document.querySelector('.stage');

  class Spring {
    constructor(initial = 0, stiffness = 170, damping = 18) {
      this.value = initial; this.target = initial; this.velocity = 0;
      this.stiffness = stiffness; this.damping = damping;
    }
    set(target) { this.target = target; }
    step(dt) {
      this.velocity += ((this.target - this.value) * this.stiffness - this.velocity * this.damping) * dt;
      this.value += this.velocity * dt;
      return this.value;
    }
  }

  const springs = {
    bodyY: new Spring(0, 140, 16), bodyTilt: new Spring(0, 120, 15), bodyScaleY: new Spring(1, 150, 18),
    faceX: new Spring(0, 140, 18), faceY: new Spring(0, 140, 18),
    pupilX: new Spring(0, 210, 20), pupilY: new Spring(0, 210, 20),
    armLShoulder: new Spring(-22, 130, 16), armLElbow: new Spring(-18, 145, 17), armLWrist: new Spring(-10, 160, 18),
    armRShoulder: new Spring(22, 130, 16), armRElbow: new Spring(18, 145, 17), armRWrist: new Spring(10, 160, 18),
    mouthOpen: new Spring(0, 290, 24), mouthWidth: new Spring(1, 260, 22), browLift: new Spring(0, 160, 18),
  };

  const POSE_PRESETS = {
    idle: { armL: [-26, -16, -8], handL: 'relaxed', armR: [26, 16, 8], handR: 'relaxed', eyes: 'normal', brow: 0, tilt: 0 },
    friendly: { armL: [-14, -48, -14], handL: 'chest', armR: [-22, -32, -16], handR: 'open', eyes: 'normal', brow: -1.5, tilt: 1.5 },
    explain: { armL: [14, 24, 8], handL: 'pointing', armR: [-18, -36, -12], handR: 'open', eyes: 'normal', brow: -1, tilt: -1.8 },
    thinking: { armL: [-40, -48, -8], handL: 'relaxed', armR: [134, 82, -140], handR: 'thinking', eyes: 'normal', brow: 2.2, tilt: -3.2 },
    happy: { armL: [34, 26, 14], handL: 'open', armR: [-34, -26, -14], handR: 'open', eyes: 'happy', brow: -3, tilt: 0 },
    aha: { armL: [46, 38, 6], handL: 'aha', armR: [28, 18, 8], handR: 'relaxed', eyes: 'normal', brow: -3.2, tilt: 2.4 },
    surprised: { armL: [48, 22, 14], handL: 'open', armR: [-48, -22, -14], handR: 'open', eyes: 'shock', brow: -5.5, tilt: -2.4 },
  };
  const TALK_CHOREO = ['friendly', 'explain', 'aha', 'friendly'];
  const HAND_POSES = ['relaxed', 'open', 'pointing', 'chest', 'thinking', 'aha'];
  const EXPRESSIONS = ['normal', 'happy', 'thinking', 'surprised'];

  const rig = {
    torso: $('rig-torso'), shadow: $('rig-shadow'), face: $('rig-face'),
    eyesNormal: $('rig-eyes-normal'), eyesHappy: $('rig-eyes-happy'), eyesShock: $('rig-eyes-shock'),
    eyeLeft: $('eye-left-group'), eyeRight: $('eye-right-group'),
    eyeShockL: $('eye-shock-left-group'), eyeShockR: $('eye-shock-right-group'),
    pupilL: $('pupil-left'), pupilR: $('pupil-right'),
    shockPupilL: $('shock-pupil-left'), shockPupilR: $('shock-pupil-right'),
    browL: $('brow-left'), browR: $('brow-right'),
    armLSh: $('arm-left-shoulder'), armRSh: $('arm-right-shoulder'),
    tubeLD: $('arm-left-tube-dark'), tubeLW: $('arm-left-tube-white'),
    tubeRD: $('arm-right-tube-dark'), tubeRW: $('arm-right-tube-white'),
    armRFront: $('arm-right-front'), tubeRFD: $('arm-right-front-tube-dark'), tubeRFW: $('arm-right-front-tube-white'),
    handL: $('hand-left'), handR: $('hand-right'),
    mouthClosed: $('mouth-closed-path'), mouthOpenGroup: $('mouth-open-group'),
    mouthCavity: $('mouth-cavity'), mouthTeeth: $('mouth-teeth'), mouthTongue: $('mouth-tongue'),
  };

  const state = {
    expression: 'normal', pose: 'idle', talking: false,
    lookX: 0, lookY: 0, blinkScale: 1, eyeScale: 1,
    nextBlinkAt: performance.now() + 2600,
    talkGestureIdx: 0, lastGestureSwitch: 0,
    mouthTimer: null, talkEndTimer: null, frozen: false,
    rightHandPose: 'relaxed',
  };

  function setHandPose(side, poseName) {
    const cls = side === 'left' ? '.hand-left-pose' : '.hand-right-pose';
    document.querySelectorAll(cls).forEach((g) => {
      g.classList.toggle('hidden', g.dataset.hand !== poseName);
    });
    if (side === 'right') state.rightHandPose = poseName;
  }
  function getHandPose(side) {
    const sel = side === 'left' ? '.hand-left-pose' : '.hand-right-pose';
    const el = document.querySelector(sel + ':not(.hidden)');
    return el ? el.dataset.hand : 'relaxed';
  }

  function applyPosePreset(presetKey) {
    const p = POSE_PRESETS[presetKey] || POSE_PRESETS.idle;
    springs.armLShoulder.set(p.armL[0]); springs.armLElbow.set(p.armL[1]); springs.armLWrist.set(p.armL[2]);
    springs.armRShoulder.set(p.armR[0]); springs.armRElbow.set(p.armR[1]); springs.armRWrist.set(p.armR[2]);
    springs.browLift.set(p.brow);
    setHandPose('left', p.handL);
    setHandPose('right', p.handR);
    rig.eyesNormal.classList.toggle('hidden', p.eyes !== 'normal');
    rig.eyesHappy.classList.toggle('hidden', p.eyes !== 'happy');
    rig.eyesShock.classList.toggle('hidden', p.eyes !== 'shock');
    rig.armRFront.classList.toggle('hidden', presetKey !== 'thinking');
  }

  function setVowel(vowel, isThinkingMouth = false) {
    if (vowel === 'A') { springs.mouthOpen.set(1.0); springs.mouthWidth.set(1.18); }
    else if (vowel === 'E') { springs.mouthOpen.set(0.68); springs.mouthWidth.set(1.12); }
    else if (vowel === 'I') { springs.mouthOpen.set(0.42); springs.mouthWidth.set(1.08); }
    else if (vowel === 'O') { springs.mouthOpen.set(0.76); springs.mouthWidth.set(0.68); }
    else if (vowel === 'U') { springs.mouthOpen.set(0.44); springs.mouthWidth.set(0.56); }
    else { springs.mouthOpen.set(0); springs.mouthWidth.set(isThinkingMouth ? 0.72 : 1.0); }
  }

  function setMouth(shape) {
    const map = { closed: 'closed', small: 'I', medium: 'E', wide: 'A', thinking: 'closed' };
    setVowel(map[shape] || 'closed', shape === 'thinking');
  }

  function setEyes(mode) {
    rig.eyesNormal.classList.toggle('hidden', mode !== 'normal');
    rig.eyesHappy.classList.toggle('hidden', mode !== 'happy');
    rig.eyesShock.classList.toggle('hidden', mode !== 'shock');
  }

  function renderParametricMouth(open, width) {
    if (open < 0.12) {
      rig.mouthClosed.classList.remove('hidden');
      rig.mouthOpenGroup.classList.add('hidden');
      rig.mouthClosed.setAttribute('d', state.pose === 'thinking' ? 'M -7 2 Q 0 -2.5 7 1' : 'M -11 -1 Q 0 8 11 -1');
      return;
    }
    rig.mouthClosed.classList.add('hidden');
    rig.mouthOpenGroup.classList.remove('hidden');
    const halfW = 11.6 * width;
    const topY = -3.2 - open * 2.0;
    const botY = 3.2 + open * 10.8;
    const d = 'M ' + (-halfW).toFixed(1) + ' ' + topY.toFixed(1) + ' Q 0 ' + (topY - 1.8).toFixed(1) + ' ' + halfW.toFixed(1) + ' ' + topY.toFixed(1) + ' C ' + halfW.toFixed(1) + ' ' + (botY - 0.8).toFixed(1) + ', ' + (halfW * 0.55).toFixed(1) + ' ' + botY.toFixed(1) + ', 0 ' + botY.toFixed(1) + ' C ' + (-halfW * 0.55).toFixed(1) + ' ' + botY.toFixed(1) + ', ' + (-halfW).toFixed(1) + ' ' + (botY - 0.8).toFixed(1) + ', ' + (-halfW).toFixed(1) + ' ' + topY.toFixed(1) + ' Z';
    rig.mouthCavity.setAttribute('d', d);
    if (open > 0.38 && width > 0.78) {
      const tw = halfW * 0.72; const ty = topY + 0.5;
      rig.mouthTeeth.classList.remove('hidden');
      rig.mouthTeeth.setAttribute('d', 'M ' + (-tw).toFixed(1) + ' ' + ty.toFixed(1) + ' Q 0 ' + (ty - 0.8).toFixed(1) + ' ' + tw.toFixed(1) + ' ' + ty.toFixed(1) + ' L ' + (tw * 0.9).toFixed(1) + ' ' + (ty + 2.8).toFixed(1) + ' Q 0 ' + (ty + 2.1).toFixed(1) + ' ' + (-tw * 0.9).toFixed(1) + ' ' + (ty + 2.8).toFixed(1) + ' Z');
    } else {
      rig.mouthTeeth.classList.add('hidden');
    }
    const lgW = halfW * 0.62;
    const lgBase = botY - 0.5;
    const lgPeak = botY - Math.min(6.4, open * 6.0);
    rig.mouthTongue.setAttribute('d', 'M ' + (-lgW).toFixed(1) + ' ' + (lgBase - 1.6).toFixed(1) + ' Q 0 ' + lgPeak.toFixed(1) + ' ' + lgW.toFixed(1) + ' ' + (lgBase - 1.6).toFixed(1) + ' Q 0 ' + lgBase.toFixed(1) + ' ' + (-lgW).toFixed(1) + ' ' + (lgBase - 1.6).toFixed(1) + ' Z');
  }

  function updateLeds() {
    svg.classList.toggle('leds-active', state.talking);
    svg.classList.toggle('leds-thinking', !state.talking && state.pose === 'thinking');
  }

  let rigTime = 0;

  function frameValues(dt, noWobble = false) {
    const t = rigTime;
    const amp = (v) => (noWobble ? 0 : v);
    const talking = state.pose === 'talking';
    const happy = state.pose === 'happy';
    const steady = noWobble || state.pose === 'thinking';
    return {
      by: springs.bodyY.step(dt), bt: springs.bodyTilt.step(dt), bsy: springs.bodyScaleY.step(dt),
      fx: springs.faceX.step(dt), fy: springs.faceY.step(dt),
      px: springs.pupilX.step(dt), py: springs.pupilY.step(dt),
      lSh: springs.armLShoulder.step(dt) + amp(Math.sin(t * 2.4) * (talking ? 7 : 2.2)),
      lEl: springs.armLElbow.step(dt) + amp(Math.cos(t * 3.1) * (happy ? 12 : 2.5)),
      lWr: springs.armLWrist.step(dt),
      rSh: springs.armRShoulder.step(dt) - amp(steady ? 0 : Math.sin(t * 2.4 + 0.6) * (talking ? 7 : 2.2)),
      rEl: springs.armRElbow.step(dt) - amp(steady ? 0 : Math.cos(t * 3.1 + 0.6) * (happy ? 12 : 2.5)),
      rWr: springs.armRWrist.step(dt),
      mO: springs.mouthOpen.step(dt), mW: springs.mouthWidth.step(dt), bLift: springs.browLift.step(dt),
      blink: state.blinkScale, eyeScale: state.eyeScale,
    };
  }

  function bendTube(ex, ey, wx, wy) {
    const l1 = Math.hypot(ex, ey), l2 = Math.hypot(wx - ex, wy - ey);
    const ux = ex / l1, uy = ey / l1;
    const vx = (wx - ex) / l2, vy = (wy - ey) / l2;
    const phi = Math.acos(Math.max(-1, Math.min(1, ux * vx + uy * vy)));
    if (phi < 0.05) return 'M 0 0 L ' + wx.toFixed(2) + ' ' + wy.toFixed(2);
    const t = Math.min(14 * Math.tan(phi / 2), 0.45 * l1, 0.45 * l2);
    const r = t / Math.tan(phi / 2);
    const c = (4 / 3) * Math.tan(phi / 4) * r;
    const p1x = ex - ux * t, p1y = ey - uy * t;
    const p2x = ex + vx * t, p2y = ey + vy * t;
    return 'M 0 0 L ' + p1x.toFixed(2) + ' ' + p1y.toFixed(2) +
      ' C ' + (p1x + ux * c).toFixed(2) + ' ' + (p1y + uy * c).toFixed(2) +
      ', ' + (p2x - vx * c).toFixed(2) + ' ' + (p2y - vy * c).toFixed(2) +
      ', ' + p2x.toFixed(2) + ' ' + p2y.toFixed(2) +
      ' L ' + wx.toFixed(2) + ' ' + wy.toFixed(2);
  }

  function applyFrame(v) {
    rig.torso.setAttribute('transform', 'translate(0, ' + v.by.toFixed(2) + ') rotate(' + v.bt.toFixed(2) + ' 160 258) scale(1, ' + v.bsy.toFixed(4) + ')');
    const shadowScale = Math.max(0.84, 1 + v.by * 0.008);
    rig.shadow.setAttribute('transform', 'translate(160, 360) scale(' + shadowScale.toFixed(3) + ', 1) translate(-160, -360)');
    rig.face.setAttribute('transform', 'translate(' + v.fx.toFixed(2) + ', ' + v.fy.toFixed(2) + ')');
    const es = v.eyeScale;
    rig.eyeLeft.setAttribute('transform', 'translate(134, 136) scale(' + es.toFixed(3) + ', ' + (v.blink * es).toFixed(3) + ')');
    rig.eyeRight.setAttribute('transform', 'translate(186, 136) scale(' + es.toFixed(3) + ', ' + (v.blink * es).toFixed(3) + ')');
    rig.eyeShockL.setAttribute('transform', 'translate(134, 136) scale(' + es.toFixed(3) + ')');
    rig.eyeShockR.setAttribute('transform', 'translate(186, 136) scale(' + es.toFixed(3) + ')');
    rig.pupilL.setAttribute('transform', 'translate(' + v.px.toFixed(2) + ', ' + v.py.toFixed(2) + ')');
    rig.pupilR.setAttribute('transform', 'translate(' + v.px.toFixed(2) + ', ' + v.py.toFixed(2) + ')');
    rig.shockPupilL.setAttribute('transform', 'translate(' + (v.px * 0.5).toFixed(2) + ', ' + (v.py * 0.5).toFixed(2) + ')');
    rig.shockPupilR.setAttribute('transform', 'translate(' + (v.px * 0.5).toFixed(2) + ', ' + (v.py * 0.5).toFixed(2) + ')');
    rig.browL.setAttribute('transform', 'translate(0, ' + v.bLift.toFixed(2) + ')');
    rig.browR.setAttribute('transform', 'translate(0, ' + v.bLift.toFixed(2) + ')');
    rig.armLSh.setAttribute('transform', 'translate(66, 182) rotate(' + v.lSh.toFixed(2) + ')');
    rig.armRSh.setAttribute('transform', 'translate(254, 182) rotate(' + v.rSh.toFixed(2) + ')');
    rig.armRFront.setAttribute('transform', 'translate(254, 182) rotate(' + v.rSh.toFixed(2) + ')');
    const d2r = Math.PI / 180, la = v.lEl * d2r, ra = v.rEl * d2r;
    const lwx0 = -25 - 26 * Math.cos(la) - 2 * Math.sin(la);
    const lwy0 = 4 - 26 * Math.sin(la) + 2 * Math.cos(la);
    const rwx0 = 25 + 26 * Math.cos(ra) - 2 * Math.sin(ra);
    const rwy0 = 4 + 26 * Math.sin(ra) + 2 * Math.cos(ra);
    const lTube = bendTube(-25, 4, lwx0, lwy0);
    const rTube = bendTube(25, 4, rwx0, rwy0);
    rig.tubeLD.setAttribute('d', lTube); rig.tubeLW.setAttribute('d', lTube);
    rig.tubeRD.setAttribute('d', rTube); rig.tubeRW.setAttribute('d', rTube);
    rig.tubeRFD.setAttribute('d', rTube); rig.tubeRFW.setAttribute('d', rTube);
    rig.handL.setAttribute('transform', 'translate(66, 182) rotate(' + v.lSh.toFixed(2) + ') translate(-25, 4) rotate(' + v.lEl.toFixed(2) + ') translate(-26, 2) rotate(' + v.lWr.toFixed(2) + ')');
    const rMirror = state.rightHandPose === 'thinking' ? '' : 'scale(-1, 1) ';
    rig.handR.setAttribute('transform', 'translate(254, 182) rotate(' + v.rSh.toFixed(2) + ') translate(25, 4) rotate(' + v.rEl.toFixed(2) + ') translate(26, 2) ' + rMirror + 'rotate(' + (-v.rWr).toFixed(2) + ')');
    renderParametricMouth(v.mO, v.mW);
  }

  function snapAll() {
    Object.values(springs).forEach((s) => { s.value = s.target; s.velocity = 0; });
    applyFrame(frameValues(0, true));
  }

  let lastFrame = performance.now();

  function loop(now) {
    const dt = Math.min(0.035, Math.max(0.001, (now - lastFrame) / 1000));
    lastFrame = now;
    rigTime += dt;
    const t = rigTime;

    if (now >= state.nextBlinkAt) {
      state.nextBlinkAt = now + 2700 + Math.random() * 2400;
      state.blinkScale = 0.08;
      setTimeout(() => { state.blinkScale = 1; }, 125);
    }
    if (state.talking && now - state.lastGestureSwitch > 1450) {
      state.lastGestureSwitch = now;
      state.talkGestureIdx = (state.talkGestureIdx + 1) % TALK_CHOREO.length;
      applyPosePreset(TALK_CHOREO[state.talkGestureIdx]);
    }

    let targetY = Math.sin(t * 2.1) * 3.2;
    let targetScaleY = 1 + Math.sin(t * 2.1) * 0.008;
    const preset = POSE_PRESETS[state.pose];
    let baseTilt = preset ? preset.tilt : 0;
    let sway = Math.sin(t * 1.3) * 0.8;
    if (state.pose === 'talking') { targetY = Math.sin(t * 8.5) * 3.8 - 1.5; sway = Math.sin(t * 3.6) * 1.9; }
    else if (state.pose === 'happy') { targetY = -Math.abs(Math.sin(t * 5.8)) * 9.5; sway = Math.sin(t * 5.8) * 2.2; }
    else if (state.pose === 'thinking') { targetY = Math.sin(t * 1.6) * 1.1; sway = 0; }
    springs.bodyY.set(targetY);
    springs.bodyScaleY.set(targetScaleY);
    springs.bodyTilt.set(baseTilt + sway + state.lookX * 2.2);

    const thinkX = state.pose === 'thinking' ? -0.5 : state.lookX;
    const thinkY = state.pose === 'thinking' ? -0.55 : state.lookY;
    springs.faceX.set(thinkX * 4.5); springs.faceY.set(thinkY * 3.2);
    springs.pupilX.set(thinkX * 3.4); springs.pupilY.set(thinkY * 2.8);

    applyFrame(frameValues(dt));
    requestAnimationFrame(loop);
  }

  function stopTalking() {
    state.talking = false;
    clearInterval(state.mouthTimer);
    clearTimeout(state.talkEndTimer);
    state.mouthTimer = null; state.talkEndTimer = null;
  }

  function setExpression(name) {
    if (!EXPRESSIONS.includes(name)) name = 'normal';
    stopTalking();
    state.expression = name;
    state.eyeScale = 1;
    if (name === 'normal') { state.pose = 'idle'; applyPosePreset('idle'); setVowel('closed'); }
    else if (name === 'happy') { state.pose = 'happy'; applyPosePreset('happy'); setVowel('A'); }
    else if (name === 'thinking') { state.pose = 'thinking'; applyPosePreset('thinking'); setVowel('closed'); }
    else if (name === 'surprised') {
      state.pose = 'surprised'; applyPosePreset('surprised');
      springs.mouthOpen.set(1.02); springs.mouthWidth.set(0.46);
    }
    else { state.pose = 'aha'; applyPosePreset('aha'); setVowel('O'); }
    const thinkX = name === 'thinking' ? -0.5 : 0;
    const thinkY = name === 'thinking' ? -0.55 : 0;
    springs.faceX.set(thinkX * 4.5); springs.faceY.set(thinkY * 3.2);
    springs.pupilX.set(thinkX * 3.4); springs.pupilY.set(thinkY * 2.8);
    updateLeds();
    if (state.frozen) snapAll();
  }

  function talk(msg, duration = 3800) {
    stopTalking();
    state.talking = true;
    state.pose = 'talking';
    state.talkGestureIdx = 0;
    state.lastGestureSwitch = performance.now();
    applyPosePreset(TALK_CHOREO[0]);
    rig.eyesNormal.classList.remove('hidden');
    rig.eyesHappy.classList.add('hidden');
    state.mouthTimer = setInterval(() => {
      const shapes = ['closed', 'small', 'medium', 'wide'];
      setMouth(shapes[(Math.random() * shapes.length) | 0]);
    }, 70);
    state.talkEndTimer = setTimeout(() => setExpression(state.expression), duration);
    updateLeds();
    if (state.frozen) snapAll();
  }

  function blink() {
    state.blinkScale = 0.08;
    setTimeout(() => { state.blinkScale = 1; }, 125);
    if (state.frozen) { applyFrame(frameValues(0)); }
  }

  function setHand(side, name) {
    if (!HAND_POSES.includes(name)) return;
    setHandPose(side, name);
    if (state.frozen) snapAll();
  }

  function cycleHand(side) {
    const current = getHandPose(side);
    const next = HAND_POSES[(HAND_POSES.indexOf(current) + 1) % HAND_POSES.length];
    setHand(side, next);
  }

  rig.handL.addEventListener('click', (e) => { e.stopPropagation(); cycleHand('left'); });
  rig.handR.addEventListener('click', (e) => { e.stopPropagation(); cycleHand('right'); });

  $('btnTalk').addEventListener('click', () => talk('Halo! Heiser siap menemani perjalanan Whoosh kamu hari ini!', 3200));
  document.querySelectorAll('[data-exp]').forEach((b) => b.addEventListener('click', () => setExpression(b.dataset.exp)));
  svg.addEventListener('click', () => { if (!state.talking) talk('Halo! Heiser siap menemani perjalanan Whoosh kamu hari ini!', 3200); });

  stage.addEventListener('pointermove', (e) => {
    if (state.frozen) return;
    const rect = stage.getBoundingClientRect();
    const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    const ny = ((e.clientY - rect.top) / rect.height) * 2 - 1;
    state.lookX = Math.max(-1, Math.min(1, nx));
    state.lookY = Math.max(-1, Math.min(1, ny));
  });
  stage.addEventListener('pointerleave', () => { state.lookX = 0; state.lookY = 0; });

  window.__avatar = { talk, setExpression, blink, setMouth, setEyes, setHand, cycleHand };

  const q = new URLSearchParams(location.search);
  if (q.has('clean')) document.body.classList.add('clean');
  setExpression(q.get('expr') || 'normal');
  if (q.has('hands')) { setHand('left', q.get('hands')); setHand('right', q.get('hands')); }
  if (q.has('talk')) { setExpression('happy'); talk('', 1e9); }
  if (q.has('freeze')) {
    state.frozen = true;
    document.body.classList.add('freeze');
    state.nextBlinkAt = Infinity;
    snapAll();
  } else {
    requestAnimationFrame((n) => { lastFrame = n; loop(n); });
  }
})();
</script>
</body>
</html>
