name: whoosh-ai

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: whoosh
      POSTGRES_PASSWORD: whoosh
      POSTGRES_DB: whoosh
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whoosh -d whoosh"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      VECTOR_STORE: pgvector
      PGVECTOR_DSN: postgresql://whoosh:whoosh@db:5432/whoosh
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    command: npm run dev -- -H 0.0.0.0 -p 3000
    ports:
      - "3000:3000"
    environment:
      API_PROXY_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      - backend

  # Expo web (react-native-web). Native Android/iOS still runs on the host
  # (npm run android), which is why host port 8081 is left free: that is the
  # Metro port Expo Go / the emulator expect.
  expo:
    build: ./apps/mobile
    command: npx expo start --web --host lan --port 8081
    ports:
      - "8082:8081"
    environment:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - ./apps/mobile:/app
      - expo_node_modules:/app/node_modules
      - expo_cache:/app/.expo
    depends_on:
      - backend

volumes:
  pgdata:
  web_node_modules:
  web_next:
  expo_node_modules:
  expo_cache:
